[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-tui"
version = "0.1.0"
description = "A terminal UI for working with AOSP-style `repo` multi-repository trees"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
    "textual>=0.60.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
repo-tui = "repo_tui.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "textual-dev>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_tui = ["*.tcss", "widgets/*.tcss"]
