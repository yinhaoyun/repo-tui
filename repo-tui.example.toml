# Example repo-tui config.
#
# Copy this to <repo-root>/.repo-tui.toml (project-local, shareable with your
# team) or ~/.config/repo-tui/config.toml (personal default). A project-local
# file fully overrides the global one -- they are not merged.

[ignore]
# Shell-glob patterns (fnmatch), matched against each file's path relative to
# its own project root. Anything that matches is excluded from the +/- stats,
# the "changed" indicator, and hidden from the file list unless you press `i`.
patterns = [
    "*.pyc",
    "__pycache__/*",
    "*.o",
    "*.a",
    "*.so",
    "*.class",
    "*.swp",
    "*~",
    ".DS_Store",
    # add your own build-generated noise here, e.g.:
    # "res/values/version.xml",
    # "*_intermediates/*",
]

[ignore.per_project]
# Patterns that only apply to specific projects, keyed by manifest project
# name (not path).
# "platform/frameworks/base" = ["res/values/version.xml"]

[display]
# Show every project by default instead of hiding unchanged ones (press `a`
# to toggle at runtime either way).
show_all_default = false
# Everything below can also be changed in the settings screen (`o`); a value
# saved there wins over this file.
#
# High-contrast keycaps for key hints and bold tips (default: true).
# highlight_hints = true
# Any Textual theme: textual-dark (default), textual-light, nord, gruvbox,
# dracula, tokyo-night, catppuccin-mocha, ...; repo-tui's extras: github-dark,
# github-light, everforest-dark, everforest-light, kanagawa, ayu-dark,
# ayu-mirage, ayu-light, night-owl, material-palenight, oceanic-next, cobalt2,
# horizon, synthwave-84, zenburn, high-contrast-dark, high-contrast-light,
# matrix, amber-crt; or one of your own from [themes.<name>] below.
# theme = "nord"
# Project list order: "changed" (default), "changes", "branch" or "path".
# sort = "changed"

[performance]
# How many projects to run `git status` on in parallel. Raise this on a
# machine with fast local disk/SSD and many CPU cores; lower it on slow or
# network-backed storage.
max_workers = 16

[sync]
# Parallel jobs for `repo sync -jN` (sync, sync all, detach). Default: the
# number of CPUs. Lower it if your git server throttles you.
# jobs = 8
# Ask y/N before `Space S` syncs the whole tree (default: false).
# confirm_all = true

[behaviour]
# After a repo command, open its output screen "always" (default), or only on
# "problems" (failed, or printed errors/warnings); a toast otherwise.
# result_screen = "problems"
# Rescan git status in the background every N minutes (0 = off, default).
# auto_refresh_minutes = 5
# Check GitHub for a newer repo-tui at startup and every N hours while it
# runs (1, 3, 6 (default), 12 or 24); check_updates = false turns it off.
# check_updates = true
# update_check_hours = 6

# Your own themes: one [themes.<name>] table each, then pick it with
# `theme = "<name>"` above or in the settings screen (o -> Display -> Theme).
# Only `primary` is required; Textual derives the rest. A theme with a bad
# value is skipped and the problem is shown when repo-tui starts.
#
# [themes.my-theme]
# dark = true
# primary = "#ff8800"
# secondary = "#88aaff"
# accent = "#ffcc00"
# warning = "#ffb000"      # key hints are drawn as black text on this colour
# error = "#ff4444"
# success = "#44dd66"
# foreground = "#e6e6e6"
# background = "#101418"
# surface = "#161b22"
# panel = "#1f2630"
